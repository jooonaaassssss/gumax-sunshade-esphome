# ===========================================================================
# gumax-sunshade-esphome  –  AOK-E AM68 / Gumax RS485 awning motor controller
#
# Board: Waveshare ESP32-S3-RS485-CAN (isolated RS485, direction pin GPIO21).
#
# USER CONFIGURATION: edit the substitutions block and the packages block
# to match your board, motor IDs, names and channel assignments.
# Everything else should work unchanged for a standard installation.
#
# See README for wiring, motor addressing and the protocol reference.
# ===========================================================================
external_components:
  # Patched copy of uartex (eigger/espcomponents v260904, MIT, hub + cover
  # only) in components/uartex: the frame parser resynchronises on the next
  # header instead of discarding it with a truncated frame.  README → uartex.
  - source:
      type: local
      path: components
    components: [ uartex ]

substitutions:
  device_name: awning-motor
  friendly_name: Awning Motor Controller

  # ── UART pins (Waveshare ESP32-S3-RS485-CAN) ─────────────────────────────
  uart_rx_pin: GPIO18
  uart_tx_pin: GPIO17
  uart_flow_control_pin: GPIO21   # RS485 driver enable (DE/RE)

  # ── Polling ───────────────────────────────────────────────────────────────
  # Status queries per motor (README → How feedback works):
  poll_interval: 15s          # idle motor
  fast_poll_interval: 3s      # while the motor moves (live position)
  offline_poll_interval: 5min # motor offline, e.g. not connected
  offline_timeout: 90s        # no reply for this long → Online off

  # ── Position direction ────────────────────────────────────────────────────
  # Which end the motors count their raw position (0–100) from depends on
  # how their end limits were set (README → Position conventions).
  #   true:  raw 0 = open, 100 = closed   (this installation, since 2026-10-31)
  #   false: raw 0 = closed, 100 = open
  # Check: with an awning fully open, the log shows "Motor N  open=…%
  # (raw 0)" → true, "(raw 100)" → false.  Per motor: add
  # position_reversed to that motor's vars below.
  position_reversed: "true"

  # ── Channel bytes ─────────────────────────────────────────────────────────
  # These must match the channel programmed into each motor (see README).
  #
  # Channel bitmask quick reference (ChanH is 0x00 for channels 1‒8):
  #   Ch 1  ChanL=0x01   Ch 2  ChanL=0x02   Ch 3  ChanL=0x04
  #   Ch 4  ChanL=0x08   Ch 5  ChanL=0x10   Ch 6  ChanL=0x20
  #   Ch 7  ChanL=0x40   Ch 8  ChanL=0x80
  group1_channel_l: "0x01"
  group1_channel_h: "0x00"
  group2_channel_l: "0x02"
  group2_channel_h: "0x00"

# ---------------------------------------------------------------------------
# Per-motor and broadcast package includes
#
# Each motor_N entry creates one cover entity (awning_N) and its diagnostic
# sensors.  motor_id and the channel bytes must match what has been
# programmed into the physical motor (README → "Addressing motors").
#
# This installation:  motors 1–4 = IDs 1–4 on channel 1,
#                     motor 5    = ID 5   on channel 2.
#
# To add a motor: copy an existing motor_N block, increment the key, and
# set motor_id, motor_name, channel_l, channel_h.  No other edits needed.
# ---------------------------------------------------------------------------
packages:
  # ── Individual motors ─────────────────────────────────────────────────────
  motor_1:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 1
        motor_name: "Awning 1"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_2:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 2
        motor_name: "Awning 2"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_3:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 3
        motor_name: "Awning 3"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_4:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 4
        motor_name: "Awning 4"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_5:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 5
        motor_name: "Awning 5"
        channel_l: ${group2_channel_l}
        channel_h: ${group2_channel_h}

  # ── All-awnings broadcast (ID=0, ChanL=0, ChanH=0) ──────────────────────
  # Channel-filtered broadcasts (ID=0 with non-zero channel bytes) do not
  # work: every motor obeys an ID=0 frame regardless of its channel.
  group_all:
    !include
      file: packages/group.yaml
      vars:
        group_name: "All Awnings"
        group_id: awning_all

  # ── Motor programming (Programming Mode, Scan Bus, status) ──────────────
  # Required by packages/motor.yaml (per-motor Program buttons).
  programming: !include packages/programming.yaml

# ---------------------------------------------------------------------------
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Bus logic (README → How feedback works): reply decoding, motor state
  # and polling, entity glue.
  includes:
    - include/awning_frame.h
    - include/awning_motion.h
    - include/awning_motor.h
  # Reported to Home Assistant and shown in the device info.
  # Bump the version on every firmware-relevant change (README → Versioning).
  project:
    name: jooonaaassssss.gumax-sunshade-esphome
    version: "1.5.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      # Link only the generic flash driver, which this board's flash chip
      # uses (the boot log suggests it), and save the IRAM of the vendor
      # drivers.  Other boards: remove the line or set what the log suggests.
      flash_chip: generic

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # logs on the native USB-C port

api:
  encryption:
    key: !secret api_key

# OTA uploads are encrypted and authenticated with the API key above
# (no separate OTA password).  Plaintext uploads are refused, so a lost
# api_key means flashing over USB.  See README → Firmware updates (OTA).
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # fast_connect is deliberately not set: with a mesh or several access points
  # sharing the SSID, the default full scan picks the strongest AP.  Only
  # enable it for a single, fixed AP (or a hidden SSID).
  #
  # Fallback hotspot: opens when the configured network is unreachable
  # (after ap_timeout, default 90s).  Connect to it and use the captive
  # portal to enter new WiFi credentials.
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

# Clock for the per-motor "Last Seen" sensors (UTC).  Both sources set the
# system clock: Home Assistant over the native API, SNTP from the internet
# (pool.ntp.org) when Home Assistant is not connected.  No time until one
# of them has synchronised.
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time

# ---------------------------------------------------------------------------
# Web interface  –  http://${device_name}.local/  (LAN only, see README)
#
# local: true embeds the v3 UI in the firmware (no internet/CDN needed).
# ota: false keeps firmware uploads out of the web UI; updates go through
# the encrypted native API (ota: esphome).  The captive portal still offers
# its own upload page, but only in fallback AP mode.
# ---------------------------------------------------------------------------
web_server:
  port: 80
  version: 3
  local: true
  ota: false
  auth:
    # Digest: the password is never sent in clear text (ESPHome's recommended
    # scheme and the default from 2027.1).  The connection itself is still
    # unencrypted HTTP.
    type: digest
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: sg_awnings
      name: "Awnings"
      sorting_weight: 10
    - id: sg_service
      name: "Service"
      sorting_weight: 20
    - id: sg_programming
      name: "Programming"
      sorting_weight: 25
    - id: sg_diagnostics
      name: "Diagnostics"
      sorting_weight: 30

# ---------------------------------------------------------------------------
# RS485 UART  –  2400 baud 8N1  (matches motor specification)
# flow_control_pin drives the transceiver's driver enable while transmitting.
# ---------------------------------------------------------------------------
uart:
  id: rs485_bus
  rx_pin: ${uart_rx_pin}
  tx_pin: ${uart_tx_pin}
  flow_control_pin: ${uart_flow_control_pin}
  baud_rate: 2400
  # Raw receive tap (ESPHome's UART debugger; the lambda is its only output).
  # Bytes without a gap of more than 8 ms form one burst, i.e. one reply
  # (both copies).  Every burst is logged at DEBUG, damaged ones included,
  # and passed to the bus_rx_listeners: the awning::Motor of each motor
  # (position, operation, voltage, online, last seen; include/awning_motor.h)
  # and the bus scan (packages/programming.yaml).
  debug:
    direction: RX
    dummy_receiver: false
    after:
      timeout: 8ms
    sequence:
      - lambda: |-
          ESP_LOGD("rs485", "RX %s", format_hex_pretty(bytes).c_str());
          for (auto &listener : id(bus_rx_listeners)) listener(bytes);

globals:
  # Registered at boot by packages/motor.yaml and packages/programming.yaml.
  # Argument: one burst of received bytes (see the uart: debug block).
  - id: bus_rx_listeners
    type: std::vector<std::function<void(const std::vector<uint8_t> &)>>
  # Payload parsed from RS485 Raw Command; empty if refused.
  - id: raw_payload
    type: std::vector<uint8_t>

# Motor state, poll schedule and the All Awnings state (include/awning_motor.h).
interval:
  - interval: 200ms
    then:
      - lambda: "awning::loop_all();"

# ---------------------------------------------------------------------------
# UARTEx hub – RS485 command queue.
#
# uartex sends the cover commands, the status queries and the frames of
# RS485 Raw Command and the programming scripts, one every tx_delay.  Its
# write callback lets each awning::Motor follow the commands on the bus.
# Its frame parser only feeds the RS485 Error sensor: replies are decoded
# from the raw receive tap (uart: debug), which also reads damaged replies.
#
# RX frame (motor → ESP):  [0xd8] [ID] [CL] [CH] [b3] [volt] [b5] [pos] [zone] [chk]
#   Header 0xd8 │ 8 payload bytes │ XOR checksum (payload bytes only)
#
# TX frame (ESP → motor):  [0x9a] [ID] [CL] [CH] [Cmd1] [Cmd2] [chk]
#   Header 0x9a │ 5 payload bytes │ XOR checksum (payload bytes only)
#   uartex adds the header and calculates the checksum automatically.
# ---------------------------------------------------------------------------
uartex:
  id: uartex_hub
  uart_id: rs485_bus
  rx_header: [0xd8]
  tx_header: [0x9a]
  rx_length: 10             # total frame = 1 header + 8 payload + 1 checksum
  rx_timeout: 50ms
  rx_checksum: xor_no_header
  tx_checksum: xor_no_header
  tx_delay: 1500ms          # inter-command gap; gives each motor time to respond
  rx_priority: loop         # non-blocking RX; keeps the main loop responsive
  # Every reply is logged by the raw receive tap in the uart: block.
  # Result of the last received frame: "None" or e.g. "Checksum Error".
  # Published only when it changes.
  error:
    name: "RS485 Error"
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: 90

# ---------------------------------------------------------------------------
# Manual hex-command text entity
#
# In Home Assistant, write exactly 6 space-separated hex bytes to this entity
# to send an arbitrary RS485 frame.  The header (0x9a) and verify byte are
# handled automatically by the uartex hub.
#
# Input format:  9a  ID  CL  CH  Cmd1  Cmd2
#   (the leading 9a is accepted and stripped; uartex re-adds it as tx_header)
#
# Frame layout:
#   Byte 0: 9a              ← always the frame head  (stripped, auto-added)
#   Byte 1: ID              ← 01–FF individual,  00 = broadcast
#   Byte 2: ChanL           ← low channel byte
#   Byte 3: ChanH           ← high channel byte
#   Byte 4: Cmd1            ← 0a = motion,  dd = position,  cc = status,
#                             aa = program ID/channel
#   Byte 5: Cmd2            ← motion: dd=UP  cc=STOP  ee=DOWN
#                             position: 00–64 hex, raw (see position_reversed)
#                             status: 00,  program: aa
#
# Examples:
#   Awning 1 UP          : 9a 01 01 00 0a dd
#   Awning 3 STOP        : 9a 03 01 00 0a cc
#   Awning 5 status      : 9a 05 02 00 cc 00
#   All UP               : 9a 00 00 00 0a dd
#   Program ID 2, ch. 1  : 9a 02 01 00 aa aa   (only one motor on the bus!)
#
# Programming frames (aa aa) are refused while Programming Mode is off
# (every connected motor would take the new ID); with Programming Mode on
# they restart its 10-minute timer.  Malformed input is logged and not sent.
# ---------------------------------------------------------------------------
text:
  - platform: template
    id: raw_hex_command
    name: "RS485 Raw Command"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 50
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 1
    on_value:
      then:
        - lambda: |-
            auto payload = awning::parse_hex_payload(x);
            if (payload.empty()) {
              ESP_LOGW("awning", "RS485 Raw Command: expected \"9a ID CL CH Cmd1 Cmd2\" in hex, got \"%s\"",
                       x.c_str());
            } else if (awning::parse_command(payload.data()).command == awning::Command::PROGRAM) {
              if (id(prog_mode).state) {
                id(prog_mode_timer).execute();
              } else {
                ESP_LOGW("awning", "RS485 Raw Command: programming frame refused, Programming Mode is off");
                id(prog_status).publish_state("Refused raw programming frame: switch on Programming Mode first");
                payload.clear();
              }
            }
            id(raw_payload) = payload;
        - if:
            condition:
              lambda: "return !id(raw_payload).empty();"
            then:
              - uartex.write:
                  data: !lambda "return id(raw_payload);"

# ---------------------------------------------------------------------------
# The per-motor covers (awning_1 … awning_N) and the all-awnings broadcast
# cover come from the packages block above.

# ---------------------------------------------------------------------------
# Service buttons and diagnostics
# ---------------------------------------------------------------------------
button:
  - platform: restart
    name: "Restart"
    entity_category: config
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 2
  - platform: safe_mode
    name: "Safe Mode"
    entity_category: config
    web_server:
      sorting_group_id: sg_service
      sorting_weight: 3

# Diagnostics group: the per-motor sensors come first (Online, Voltage,
# Last Seen at weights N, N.1, N.2), then RS485 Error (90).
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: 100
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: 101

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
      web_server:
        sorting_group_id: sg_diagnostics
        sorting_weight: 102
  - platform: version
    name: "ESPHome Version"
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: 103
