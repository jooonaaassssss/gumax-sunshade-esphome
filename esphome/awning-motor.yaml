# ===========================================================================
# gumax-sunshade-esphome  –  AOK-E AM68 / Gumax RS485 awning motor controller
# Angepasst für: Waveshare ESP32-S3-RS485-CAN (isoliertes RS485, SP3485)
#
# USER CONFIGURATION: edit the substitutions block and the packages block
# to match your motor IDs, names, and channel assignments.
# Everything else should work unchanged for a standard installation.
#
# See README for full wiring instructions and protocol reference.
# ===========================================================================
external_components:
  - source: github://eigger/espcomponents@latest
    components: [ uartex ]
    refresh: always

substitutions:
  device_name: awning-motor
  friendly_name: Awning Motor Controller

  # ── UART pins (Waveshare ESP32-S3-RS485-CAN) ─────────────────────────────
  uart_rx_pin: GPIO18
  uart_tx_pin: GPIO17
  uart_flow_control_pin: GPIO21   # DE/RE des SP3485 (Senderichtung)

  # ── Polling ───────────────────────────────────────────────────────────────
  poll_interval: 30s        # How often to query all motors for status

  # ── Channel bytes ─────────────────────────────────────────────────────────
  # These must match the channel programmed into each motor (see README).
  #
  # Channel bitmask quick reference (ChanH is 0x00 for channels 1‒8):
  #   Ch 1  ChanL=0x01   Ch 2  ChanL=0x02   Ch 3  ChanL=0x04
  #   Ch 4  ChanL=0x08   Ch 5  ChanL=0x10   Ch 6  ChanL=0x20
  #   Ch 7  ChanL=0x40   Ch 8  ChanL=0x80
  group1_channel_l: "0x01"
  group1_channel_h: "0x00"
  group2_channel_l: "0x02"
  group2_channel_h: "0x00"

# ---------------------------------------------------------------------------
# Per-motor and per-group package includes
#
# Each motor_N entry creates:
#   • one cover entity  (awning_N)  – polls via uartex command_update
#
# Each group_N entry creates one optimistic cover entity that broadcasts to
# all motors on the given channel.
#
# To add a motor: copy an existing motor_N block, increment the key, and
# set motor_id, motor_name, channel_l, channel_h.  No other edits needed.
# ---------------------------------------------------------------------------
packages:
  # ── Individual motors ─────────────────────────────────────────────────────
  motor_1:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 1
        motor_name: "Awning 1"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_2:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 2
        motor_name: "Awning 2"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_3:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 3
        motor_name: "Awning 3"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_4:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 4
        motor_name: "Awning 4"
        channel_l: ${group1_channel_l}
        channel_h: ${group1_channel_h}
  motor_5:
    !include
      file: packages/motor.yaml
      vars:
        motor_id: 5
        motor_name: "Awning 5"
        channel_l: ${group2_channel_l}
        channel_h: ${group2_channel_h}
  # ── All-awnings broadcast (ID=0, ChanL=0, ChanH=0) ──────────────────────
  # Note: channel-filtered group broadcast (ID=0 with non-zero channel bytes)
  # does not work – motors respond to any ID=0 broadcast regardless of channel.
  group_all:
    !include
      file: packages/group.yaml
      vars:
        group_name: "All Awnings"
        group_id: awning_all
        channel_l: "0x00"
        channel_h: "0x00"

# ---------------------------------------------------------------------------
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # Log über USB-C (native USB des S3)

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------------------
# RS485 UART  –  2400 baud 8N1  (matches motor specification)
# Waveshare-Board: Senderichtung wird über GPIO21 (flow_control_pin) gesteuert
# ---------------------------------------------------------------------------
uart:
  id: rs485_bus
  rx_pin: ${uart_rx_pin}
  tx_pin: ${uart_tx_pin}
  flow_control_pin: ${uart_flow_control_pin}
  baud_rate: 2400

# ---------------------------------------------------------------------------
# UARTEx hub – declarative RS485 frame parsing and command dispatch.
#
# RX frame (motor → ESP):  [0xd8] [ID] [CL] [CH] [b4] [b5] [b6] [pos] [zone] [chk]
#   Header 0xd8 │ 8 payload bytes │ XOR checksum (payload bytes only)
#   Payload offsets: [0]=ID  [6]=pos(0–100)  [7]=zone(bit0=moving)
#
# TX frame (ESP → motor):  [0x9a] [ID] [CL] [CH] [Cmd1] [Cmd2] [chk]
#   Header 0x9a │ 5 payload bytes │ XOR checksum (payload bytes only)
#   uartex adds the header and calculates the checksum automatically.
# ---------------------------------------------------------------------------
uartex:
  uart_id: rs485_bus
  rx_header: [0xd8]
  tx_header: [0x9a]
  rx_length: 10             # total frame = 1 header + 8 payload + 1 checksum
  rx_timeout: 50ms
  rx_checksum: xor_no_header
  tx_checksum: xor_no_header
  tx_delay: 1500ms          # inter-command gap; gives each motor time to respond

# ---------------------------------------------------------------------------
# Manual hex-command text entity
#
# In Home Assistant, write exactly 6 space-separated hex bytes to this entity
# to send an arbitrary RS485 frame.  The header (0x9a) and verify byte are
# handled automatically by the uartex hub.
#
# Input format:  9a  ID  CL  CH  Cmd1  Cmd2
#   (the leading 9a is accepted and stripped; uartex re-adds it as tx_header)
#
# Frame layout:
#   Byte 0: 9a              ← always the frame head  (stripped, auto-added)
#   Byte 1: ID              ← 01–08 individual,  00 = group broadcast
#   Byte 2: ChanL           ← low channel byte
#   Byte 3: ChanH           ← high channel byte
#   Byte 4: Cmd1            ← 0a = motion,  dd = position
#   Byte 5: Cmd2            ← motion: dd=UP  cc=STOP  ee=DOWN
#                             position: 00–64 hex (0=open … 100=closed)
#
# Examples:
#   Awning 1 UP    : 9a 01 01 00 0a dd
#   Awning 3 STOP  : 9a 03 01 00 0a cc
#   All UP         : 9a 00 00 00 0a dd
# ---------------------------------------------------------------------------
text:
  - platform: template
    id: raw_hex_command
    name: "RS485 Raw Command"
    mode: text
    optimistic: true
    min_length: 0
    max_length: 50
    on_value:
      then:
        - uartex.write:
            data: !lambda |-
              const char *s = x.c_str();
              std::vector<uint8_t> frame;
              while (*s) {
                while (*s == ' ') s++;
                if (!*s) break;
                char *end;
                long val = strtol(s, &end, 16);
                if (end == s) break;
                frame.push_back((uint8_t)val);
                s = end;
              }
              // Strip the leading 0x9a header byte – uartex adds it automatically.
              if (!frame.empty() && frame[0] == 0x9a) frame.erase(frame.begin());
              if (frame.size() != 5) {
                ESP_LOGW("awning", "Expected 5 payload bytes (or 6 with 9a), got %d",
                         (int)frame.size());
                return {};
              }
              return frame;

# ---------------------------------------------------------------------------
# Per-motor covers (awning_1 … awning_N), per-channel group covers, and
# the all-awnings broadcast cover all come from the packages block above.
