# ===========================================================================
# packages/motor.yaml  –  per-motor package template
#
# Included once per motor by awning-motor.yaml via:
#
#   packages:
#     motor_1:
#       !include
#         file: packages/motor.yaml
#         vars:
#           motor_id: "1"
#           motor_name: "Awning 1"
#           channel_l: "0x01"
#           channel_h: "0x00"
#
# Provides:
#   • globals:        motor_last_seen_${motor_id}
#   • binary_sensor:  awning_${motor_id}_online
#   • cover:          awning_${motor_id}
#   • script !extend: poll_motors  (appends query lambda + 1 s delay)
# ===========================================================================

defaults:
  motor_id: "1"
  motor_name: "Awning 1"
  channel_l: "0x01"
  channel_h: "0x00"
  offline_timeout_ms: "90000"

globals:
  - id: motor_last_seen_${motor_id}
    type: uint32_t
    restore_value: false
    initial_value: '0'

binary_sensor:
  - platform: template
    name: "${motor_name} Online"
    id: awning_${motor_id}_online
    device_class: connectivity

cover:
  - platform: template
    name: "${motor_name}"
    id: awning_${motor_id}
    device_class: awning
    optimistic: true
    has_position: true
    open_action:
      - lambda: |-
          const uint8_t m=${motor_id},cL=${channel_l},cH=${channel_h},c1=0x0a,c2=0xdd;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
    close_action:
      - lambda: |-
          const uint8_t m=${motor_id},cL=${channel_l},cH=${channel_h},c1=0x0a,c2=0xee;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
    stop_action:
      - lambda: |-
          const uint8_t m=${motor_id},cL=${channel_l},cH=${channel_h},c1=0x0a,c2=0xcc;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
    position_action:
      - lambda: |-
          const uint8_t m=${motor_id},cL=${channel_l},cH=${channel_h};
          uint8_t pct=(uint8_t)((1.0f-pos)*100.0f+0.5f);
          uint8_t f[]={0x9a,m,cL,cH,0xdd,pct,(uint8_t)(m^cL^cH^0xdd^pct)};
          id(rs485_bus).write_array(f,7);

# Extend rx_dispatch: update this motor's state when the parsed frame ID matches.

# Extend the poll_motors script defined in the main file with:
#   1. Availability timeout check for this motor
#   2. Status-query frame
#   3. 1 s inter-motor gap
script:
  - id: !extend rx_dispatch
    then:
      - lambda: |-
          if (id(rx_mid) != ${motor_id}) return;
          id(motor_last_seen_${motor_id}) = millis();
          id(awning_${motor_id}_online).publish_state(true);
          id(awning_${motor_id}).position = id(rx_esp_pos);
          id(awning_${motor_id}).current_operation = id(rx_running)
            ? cover::COVER_OPERATION_OPENING : cover::COVER_OPERATION_IDLE;
          id(awning_${motor_id}).publish_state();
  - id: !extend poll_motors
    then:
      - lambda: |-
          const uint32_t TIMEOUT_MS = ${offline_timeout_ms};
          uint32_t now = millis();
          id(awning_${motor_id}_online).publish_state(
            id(motor_last_seen_${motor_id}) != 0 &&
            (uint32_t)(now - id(motor_last_seen_${motor_id})) < TIMEOUT_MS);
      - lambda: |-
          const uint8_t m=${motor_id}, cL=${channel_l}, cH=${channel_h}, c1=0xcc, c2=0x00;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
      - delay: 1000ms
