# ===========================================================================
# packages/motor.yaml  –  per-motor package template (uartex platform)
#
# Included once per motor by awning-motor.yaml via:
#
#   packages:
#     motor_1:
#       !include
#         file: packages/motor.yaml
#         vars:
#           motor_id: 1
#           motor_name: "Awning 1"
#           channel_l: "0x01"
#           channel_h: "0x00"
#
# All four vars are required.  poll_interval, fast_poll_interval,
# offline_poll_interval and offline_timeout come from the main file's
# substitutions, the time source ha_time from the main file as well.
#
# Provides:
#   • cover:          awning_${motor_id}  (uartex platform, position and operation)
#   • binary_sensor:  awning_${motor_id}_online  ("${motor_name} Online", diagnostic)
#   • sensor:         awning_${motor_id}_voltage  ("${motor_name} Voltage", diagnostic)
#   • text_sensor:    awning_${motor_id}_last_seen  ("${motor_name} Last Seen", diagnostic)
#   • button:         awning_${motor_id}_program  ("${motor_name} Program", config)
#
# The awning::Motor object behind them is found with
# awning::find_motor(awning::make_key(ID, CL, CH)).
#
# How it works (README → How feedback works): uartex sends this cover's
# commands and status queries.  The awning::Motor object created at boot
# (include/awning_motor.h)
#   - decodes every reply burst of the raw receive tap in the main file,
#     damaged replies included (include/awning_frame.h), and publishes
#     position, voltage, online and last seen,
#   - follows the commands written to the bus (this cover's, the broadcast
#     cover's, RS485 Raw Command) and reports opening/closing until the
#     motor reports idle,
#   - queues the status query (command_update): every poll_interval, every
#     fast_poll_interval while the motor moves, every offline_poll_interval
#     while it is offline.
# Needs bus_rx_listeners, the uartex hub uartex_hub and the interval that
# runs awning::loop_all() from the main file, and prog_run from
# packages/programming.yaml (Program button).
# ===========================================================================

cover:
  - platform: uartex
    name: "${motor_name}"
    id: awning_${motor_id}
    device_class: awning
    # Not optimistic: a command does not move the shown position; the
    # cover shows opening/closing and follows the motor's replies.
    optimistic: false
    web_server:
      sorting_group_id: sg_awnings
      sorting_weight: ${motor_id}
    # Feedback comes from awning::Motor (see above), not from uartex's frame
    # parser, which misses damaged replies.  state_position only enables
    # position support in uartex (the traits require it) and returns the
    # current position, so frames parsed by uartex change nothing.
    state_position: !lambda "return id(awning_${motor_id}).position;"
    #
    # TX payload bytes (uartex auto-prepends 0x9a header, appends XOR checksum):
    #
    command_open: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xdd}};
    command_close: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xee}};
    command_stop: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xcc}};
    command_position: !lambda |-
      uint8_t pct = (uint8_t)(x * 100.0f + 0.5f);
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0xdd, pct}, {}};
    # Status query, queued by awning::Motor (no fixed update interval).
    command_update: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0xcc, 0x00}};
    update_interval: never

binary_sensor:
  - platform: template
    name: "${motor_name} Online"
    id: awning_${motor_id}_online
    device_class: connectivity
    entity_category: diagnostic
    # Off at boot until the first reply; off after offline_timeout without one.
    lambda: |-
      const auto *motor = awning::find_motor(awning::make_key(${motor_id}, ${channel_l}, ${channel_h}));
      return motor != nullptr && motor->online();
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: ${motor_id}

# Byte 5 of the reply; 0x17/0x18 (23/24) observed.  Likely the motor's
# internal DC supply, not confirmed.  Published on change by awning::Motor.
sensor:
  - platform: template
    name: "${motor_name} Voltage"
    id: awning_${motor_id}_voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: ${motor_id}.1

# ISO 8601 in UTC; Home Assistant shows it in local time ("5 minutes ago").
text_sensor:
  - platform: template
    name: "${motor_name} Last Seen"
    id: awning_${motor_id}_last_seen
    device_class: timestamp
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: ${motor_id}.2

esphome:
  on_boot:
    - lambda: |-
        static_assert(awning::duration_ms("${poll_interval}") > 0, "poll_interval: use e.g. 15s");
        static_assert(awning::duration_ms("${fast_poll_interval}") > 0, "fast_poll_interval: use e.g. 3s");
        static_assert(awning::duration_ms("${offline_poll_interval}") > 0, "offline_poll_interval: use e.g. 5min");
        static_assert(awning::duration_ms("${offline_timeout}") > 0, "offline_timeout: use e.g. 90s");
        awning::Timing timing{};
        timing.poll_ms = awning::duration_ms("${poll_interval}");
        timing.fast_poll_ms = awning::duration_ms("${fast_poll_interval}");
        timing.offline_poll_ms = awning::duration_ms("${offline_poll_interval}");
        timing.offline_ms = awning::duration_ms("${offline_timeout}");
        auto *motor = new awning::Motor(${motor_id}, ${channel_l}, ${channel_h}, timing);
        motor->set_cover(id(awning_${motor_id}));
        motor->set_voltage_sensor(id(awning_${motor_id}_voltage));
        motor->set_last_seen_sensor(id(awning_${motor_id}_last_seen));
        motor->set_clock(id(ha_time));
        id(bus_rx_listeners).push_back([motor](const std::vector<uint8_t> &burst) { motor->on_burst(burst); });
        id(uartex_hub).add_on_write_callback([motor](const uint8_t *data, const uint16_t len) { motor->on_write(data, len); });

# Programs the motor that is alone on the bus with this motor's ID and
# channel (see packages/programming.yaml; needs Programming Mode).
button:
  - platform: template
    name: "${motor_name} Program"
    id: awning_${motor_id}_program
    icon: mdi:numeric
    entity_category: config
    web_server:
      sorting_group_id: sg_programming
      sorting_weight: ${motor_id}
    on_press:
      - script.execute:
          id: prog_run
          target_id: ${motor_id}
          chan_l: !lambda "return ${channel_l};"
          chan_h: !lambda "return ${channel_h};"
          motor_name: "${motor_name}"
