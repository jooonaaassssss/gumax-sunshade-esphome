# ===========================================================================
# packages/motor.yaml  –  per-motor package template (uartex platform)
#
# Included once per motor by awning-motor.yaml via:
#
#   packages:
#     motor_1:
#       !include
#         file: packages/motor.yaml
#         vars:
#           motor_id: 1
#           motor_name: "Awning 1"
#           channel_l: "0x01"
#           channel_h: "0x00"
#
# All four vars are required.  poll_interval is taken from the main file's
# substitutions.
#
# Provides:
#   • cover:  awning_${motor_id}  (uartex platform, full state + command support)
#
# The uartex hub (defined in the main file) dispatches incoming RX frames to
# each cover entity via the motor-ID state filter.  Polling is handled by
# command_update fired every ${poll_interval}.
# ===========================================================================

cover:
  - platform: uartex
    name: "${motor_name}"
    id: awning_${motor_id}
    device_class: awning
    optimistic: true
    web_server:
      sorting_group_id: sg_awnings
      sorting_weight: ${motor_id}
    #
    # RX frame payload bytes (after 0xd8 header, before XOR checksum):
    #   [0] motor ID   [1] ChanL   [2] ChanH
    #   [3-5] unknown ([4] appears to be the supply voltage in V, e.g. 0x18)
    #   [6] pos 0–100 (0=open)   [7] zone (bit 0 = moving)
    #
    # State filter: only process frames whose first byte equals this motor's ID.
    state:
      offset: 0
      data:
        - ${motor_id}
      match: prefix
    # Position mapping: raw 0 (open)→100 (closed)  ↔  ESPHome 1.0 (open)→0.0 (closed)
    state_position: !lambda |-
      ESP_LOGD("awning", "Motor ${motor_id}  pos=%d%%  running=%d",
               data[6], data[7] & 0x01);
      return 1.0f - (data[6] / 100.0f);
    #
    # TX payload bytes (uartex auto-prepends 0x9a header, appends XOR checksum):
    #
    command_open: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xdd}};
    command_close: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xee}};
    command_stop: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xcc}};
    command_position: !lambda |-
      uint8_t pct = (uint8_t)((1.0f - x) * 100.0f + 0.5f);
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0xdd, pct}, {}};
    command_update: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0xcc, 0x00}};
    update_interval: ${poll_interval}
