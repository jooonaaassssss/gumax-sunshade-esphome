# ===========================================================================
# packages/motor.yaml  –  per-motor package template (uartex platform)
#
# Included once per motor by awning-motor.yaml via:
#
#   packages:
#     motor_1:
#       !include
#         file: packages/motor.yaml
#         vars:
#           motor_id: 1
#           motor_name: "Awning 1"
#           channel_l: "0x01"
#           channel_h: "0x00"
#
# All four vars are required.  poll_interval is taken from the main file's
# substitutions; the time source ha_time comes from the main file as well.
#
# Provides:
#   • cover:          awning_${motor_id}  (uartex platform, full state + command support)
#   • binary_sensor:  awning_${motor_id}_online  ("${motor_name} Online", diagnostic)
#   • sensor:         awning_${motor_id}_voltage  ("${motor_name} Voltage", diagnostic)
#   • text_sensor:    awning_${motor_id}_last_seen  ("${motor_name} Last Seen", diagnostic)
#   • button:         awning_${motor_id}_program  ("${motor_name} Program", config)
#   • script:         awning_${motor_id}_online_watchdog  (internal timer)
#   • globals:        awning_${motor_id}_last_seen_ts  (internal, UTC epoch)
#
# The Program button and the boot registration need
# packages/programming.yaml (script prog_run, global prog_motors).
#
# The uartex hub (defined in the main file) dispatches incoming RX frames to
# each cover entity via the motor-ID state filter.  Polling is handled by
# command_update fired every ${poll_interval}.
#
# Online detection: every valid status frame from this motor (header,
# length and checksum checked by the hub, ID checked by the state filter)
# restarts the watchdog script.  The motor counts as online while the
# script runs, i.e. until 3 poll intervals pass without a reply.  Motors
# often do not answer while they are moving, so a single missed poll is normal.
#
# Last seen: the time of the latest frame (UTC, once ha_time is synced).
# Published when the motor comes back online, then at most every 5 minutes
# to keep the Home Assistant history small, and with the exact time of the
# last frame when the motor goes offline.
# ===========================================================================

cover:
  - platform: uartex
    name: "${motor_name}"
    id: awning_${motor_id}
    device_class: awning
    optimistic: true
    web_server:
      sorting_group_id: sg_awnings
      sorting_weight: ${motor_id}
    #
    # RX frame payload bytes (after 0xd8 header, before XOR checksum):
    #   [0] motor ID   [1] ChanL   [2] ChanH
    #   [3-5] unknown ([4] appears to be the supply voltage in V, e.g. 0x18)
    #   [6] pos 0–100 (0=closed, 100=open)   [7] zone (bit 0 = moving)
    #
    # State filter: only process frames whose first byte equals this motor's ID.
    state:
      offset: 0
      data:
        - ${motor_id}
      match: prefix
    # Position mapping: raw 0 (closed)→100 (open)  ↔  ESPHome 0.0 (closed)→1.0 (open)
    state_position: !lambda |-
      // Plausibility: a frame that lost a 0x00 byte can still pass the XOR
      // checksum, shifted by one byte.  Byte [4] (supply voltage, 0x17/0x18
      // observed) then reads 0.  Ignore such frames: returning the current
      // position changes nothing.
      if (data[4] < 16 || data[4] > 40 || data[6] > 100) {
        ESP_LOGD("awning", "Motor ${motor_id}  implausible frame ignored");
        return id(awning_${motor_id}).position;
      }
      ESP_LOGD("awning", "Motor ${motor_id}  pos=%d%%  running=%d",
               data[6], data[7] & 0x01);
      // Supply voltage (byte [4], meaning not confirmed): publish on change.
      if (id(awning_${motor_id}_voltage).state != data[4])
        id(awning_${motor_id}_voltage).publish_state(data[4]);
      // Restart the online watchdog.  stop() + execute() instead of relying
      // on mode: restart avoids a "restarting" DEBUG line for every frame.
      const bool was_online = id(awning_${motor_id}_online_watchdog).is_running();
      id(awning_${motor_id}_online_watchdog).stop();
      id(awning_${motor_id}_online_watchdog).execute();
      // Last seen (see header).
      auto now = id(ha_time).utcnow();
      if (now.is_valid()) {
        static time_t published = 0;
        id(awning_${motor_id}_last_seen_ts) = now.timestamp;
        if (!was_online || now.timestamp - published >= 300) {
          published = now.timestamp;
          id(awning_${motor_id}_last_seen).publish_state(now.strftime("%Y-%m-%dT%H:%M:%SZ"));
        }
      }
      return data[6] / 100.0f;
    #
    # TX payload bytes (uartex auto-prepends 0x9a header, appends XOR checksum):
    #
    command_open: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xdd}};
    command_close: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xee}};
    command_stop: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0x0a, 0xcc}};
    command_position: !lambda |-
      uint8_t pct = (uint8_t)(x * 100.0f + 0.5f);
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0xdd, pct}, {}};
    command_update: !lambda |-
      return {{(uint8_t)${motor_id}, ${channel_l}, ${channel_h}, 0xcc, 0x00}};
    update_interval: ${poll_interval}

script:
  # Restarted by every status frame; runs out after 3 poll intervals of silence.
  - id: awning_${motor_id}_online_watchdog
    mode: restart
    then:
      - delay: !lambda "return 3 * id(awning_${motor_id}).get_update_interval();"
      # Gone offline: report the exact time of the last frame.
      - lambda: |-
          const time_t ts = id(awning_${motor_id}_last_seen_ts);
          if (ts != 0)
            id(awning_${motor_id}_last_seen).publish_state(
                ESPTime::from_epoch_utc(ts).strftime("%Y-%m-%dT%H:%M:%SZ"));

globals:
  - id: awning_${motor_id}_last_seen_ts
    type: time_t
    initial_value: "0"

binary_sensor:
  - platform: template
    name: "${motor_name} Online"
    id: awning_${motor_id}_online
    device_class: connectivity
    entity_category: diagnostic
    # Off at boot until the first reply arrives.
    lambda: "return id(awning_${motor_id}_online_watchdog).is_running();"
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: ${motor_id}

# Byte [4] of the status frame; 0x17/0x18 (23/24) observed.  Likely the
# motor's internal DC supply, not confirmed.  Published by state_position.
sensor:
  - platform: template
    name: "${motor_name} Voltage"
    id: awning_${motor_id}_voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: ${motor_id}.1

# ISO 8601 in UTC; Home Assistant shows it in local time ("5 minutes ago").
text_sensor:
  - platform: template
    name: "${motor_name} Last Seen"
    id: awning_${motor_id}_last_seen
    device_class: timestamp
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: sg_diagnostics
      sorting_weight: ${motor_id}.2

# Programs the motor that is alone on the bus with this motor's ID and
# channel (see packages/programming.yaml; needs Programming Mode).  The
# motor is registered at boot so that Scan Bus queries it.
esphome:
  on_boot:
    - lambda: |-
        id(prog_motors).push_back((uint32_t(${motor_id}) << 16) |
                                  (uint32_t(${channel_l}) << 8) | uint32_t(${channel_h}));

button:
  - platform: template
    name: "${motor_name} Program"
    id: awning_${motor_id}_program
    icon: mdi:numeric
    entity_category: config
    web_server:
      sorting_group_id: sg_programming
      sorting_weight: ${motor_id}
    on_press:
      - script.execute:
          id: prog_run
          target_id: ${motor_id}
          chan_l: !lambda "return ${channel_l};"
          chan_h: !lambda "return ${channel_h};"
          motor_name: "${motor_name}"
