# ===========================================================================
# packages/group.yaml  –  broadcast cover package template (uartex platform)
#
# Included by awning-motor.yaml via:
#
#   packages:
#     group_all:
#       !include
#         file: packages/group.yaml
#         vars:
#           group_name: "All Awnings"
#           group_id: awning_all
#
# Provides:
#   • cover:  ${group_id}  (broadcasts to every motor on the bus)
#
# Broadcast frames use ID=0x00 with both channel bytes 0x00.  Motors obey any
# ID=0 frame regardless of their programmed channel, so a channel-filtered
# group (ID=0 with non-zero channel bytes) is not possible.
# ===========================================================================

cover:
  - platform: uartex
    name: "${group_name}"
    id: ${group_id}
    device_class: awning
    optimistic: true
    # Listed after the individual motors (weights 1…N) in the web UI.
    web_server:
      sorting_group_id: sg_awnings
      sorting_weight: 100
    # No state filter or state_position: the broadcast cover does not track
    # position (the individual motor covers handle position feedback).
    #
    # TX payload bytes (uartex auto-prepends 0x9a header, appends XOR checksum):
    command_open: !lambda |-
      return {{0x00, 0x00, 0x00, 0x0a, 0xdd}};
    command_close: !lambda |-
      return {{0x00, 0x00, 0x00, 0x0a, 0xee}};
    command_stop: !lambda |-
      return {{0x00, 0x00, 0x00, 0x0a, 0xcc}};
    command_position: !lambda |-
      uint8_t pct = (uint8_t)((1.0f - x) * 100.0f + 0.5f);
      return {{0x00, 0x00, 0x00, 0xdd, pct}, {}};
