# ===========================================================================
# packages/group.yaml  –  broadcast cover package template (uartex platform)
#
# Included by awning-motor.yaml via:
#
#   packages:
#     group_all:
#       !include
#         file: packages/group.yaml
#         vars:
#           group_name: "All Awnings"
#           group_id: awning_all
#
# Provides:
#   • cover:  ${group_id}  (broadcasts to every motor on the bus)
#
# Open, close and stop are broadcast frames (ID=0x00, both channel bytes
# 0x00), which every motor obeys regardless of its programmed channel, so a
# channel-filtered group (ID=0 with non-zero channel bytes) is not possible.
# Position frames sent to ID 0 are ignored by the motors; a position is sent
# to each motor instead (see command_position).
#
# State: the awning::Group object created at boot (include/awning_motor.h)
# shows the average position of the online motors and opening/closing while
# they move.  Each motor follows the broadcast commands itself (packages/
# motor.yaml), so the motors' feedback drives this cover as well.
# ===========================================================================

cover:
  - platform: uartex
    name: "${group_name}"
    id: ${group_id}
    device_class: awning
    optimistic: false
    # Listed after the individual motors (weights 1…N) in the web UI.
    web_server:
      sorting_group_id: sg_awnings
      sorting_weight: 100
    # The motors answer status queries, the broadcast address does not.
    # state_position only enables position support in uartex (the traits
    # require it) and returns the current position, so frames never change
    # it; awning::Group sets the state.
    state_position: !lambda "return id(${group_id}).position;"
    #
    # TX payload bytes (uartex auto-prepends 0x9a header, appends XOR checksum):
    command_open: !lambda |-
      return {{0x00, 0x00, 0x00, 0x0a, 0xdd}};
    command_close: !lambda |-
      return {{0x00, 0x00, 0x00, 0x0a, 0xee}};
    command_stop: !lambda |-
      return {{0x00, 0x00, 0x00, 0x0a, 0xcc}};
    # The motors ignore position frames sent to ID 0, so a position goes to
    # every motor that has answered since boot as its own command
    # (awning::set_position_all); the group itself sends nothing.
    command_position: !lambda |-
      awning::set_position_all(x);
      return {};
    update_interval: never

esphome:
  on_boot:
    - lambda: |-
        new awning::Group(id(${group_id}));
