# ===========================================================================
# packages/group.yaml  –  channel-group cover package template
#
# Included once per group by awning-motor.yaml via:
#
#   packages:
#     group_1:
#       !include
#         file: packages/group.yaml
#         vars:
#           group_name: "Awnings Group 1"
#           group_id: awning_group1
#           channel_l: "0x01"
#           channel_h: "0x00"
#
# Provides:
#   • cover:  ${group_id}  (broadcasts to ID=0 filtered by channel)
# ===========================================================================

defaults:
  group_name: "Awnings Group 1"
  group_id: awning_group1
  channel_l: "0x00"
  channel_h: "0x00"

cover:
  - platform: template
    name: "${group_name}"
    id: ${group_id}
    device_class: awning
    optimistic: true
    has_position: true
    open_action:
      - lambda: |-
          const uint8_t m=0,cL=${channel_l},cH=${channel_h},c1=0x0a,c2=0xdd;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
    close_action:
      - lambda: |-
          const uint8_t m=0,cL=${channel_l},cH=${channel_h},c1=0x0a,c2=0xee;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
    stop_action:
      - lambda: |-
          const uint8_t m=0,cL=${channel_l},cH=${channel_h},c1=0x0a,c2=0xcc;
          uint8_t f[]={0x9a,m,cL,cH,c1,c2,(uint8_t)(m^cL^cH^c1^c2)};
          id(rs485_bus).write_array(f,7);
    position_action:
      - lambda: |-
          const uint8_t m=0,cL=${channel_l},cH=${channel_h};
          uint8_t pct=(uint8_t)((1.0f-pos)*100.0f+0.5f);
          uint8_t f[]={0x9a,m,cL,cH,0xdd,pct,(uint8_t)(m^cL^cH^0xdd^pct)};
          id(rs485_bus).write_array(f,7);
