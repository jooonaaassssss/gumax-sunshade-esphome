# Validate and compile the ESPHome configuration and run the host test of
# the bus logic on every push and PR.  Uses the placeholder secrets from
# secrets.yaml.example; no firmware is published (no artifacts, no
# releases).
name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "2026.10.1"

jobs:
  # Host test of the bus logic in esphome/include (decoding, motor state,
  # polling); see tests/awning_test.cpp.  AddressSanitizer and
  # UndefinedBehaviorSanitizer catch out-of-bounds reads in the decoder.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and run tests/awning_test.cpp
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I esphome/include tests/awning_test.cpp -o awning_test
          ./awning_test

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esphome
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache PlatformIO and ESP-IDF toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            esphome/.esphome/.espressif
            esphome/.esphome/pio_components
          key: pio-${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-${{ hashFiles('esphome/**/*.yaml', 'esphome/secrets.yaml.example') }}
          restore-keys: |
            pio-${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-

      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"

      - name: Use placeholder secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: esphome config
        run: esphome config awning-motor.yaml

      - name: esphome compile
        run: esphome compile awning-motor.yaml
